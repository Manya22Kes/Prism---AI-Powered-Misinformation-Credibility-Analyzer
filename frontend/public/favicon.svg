<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="prismGrad1" x1="32" y1="6" x2="12" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="prismGrad2" x1="32" y1="6" x2="52" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="prismGrad3" x1="12" y1="44" x2="52" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Octahedron/Prism 3D Glass Crystal -->
  <polygon points="32,6 12,34 32,48" fill="url(#prismGrad1)" opacity="0.9"/>
  <polygon points="32,6 52,34 32,48" fill="url(#prismGrad2)" opacity="0.95"/>
  <polygon points="12,34 52,34 32,48" fill="url(#prismGrad3)" opacity="0.85"/>
  
  <!-- Outer Glow Facet Edges -->
  <polyline points="32,6 12,34 32,48 52,34 32,6" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <line x1="32" y1="6" x2="32" y2="48" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="12" y1="34" x2="52" y2="34" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
</svg>